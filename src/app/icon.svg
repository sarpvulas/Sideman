  <circle cx="16" cy="16" r="16" fill="#1a1a2e"/>

  <!-- Piano keys -->
  <rect x="6" y="10" width="4" height="12" rx="1" fill="#f0f0f0"/>
  <rect x="11" y="10" width="4" height="12" rx="1" fill="#f0f0f0"/>
  <rect x="16" y="10" width="4" height="12" rx="1" fill="#f0f0f0"/>
  <rect x="21" y="10" width="4" height="12" rx="1" fill="#f0f0f0"/>

  <!-- Black keys -->
  <rect x="8.5" y="10" width="3" height="7" rx="0.5" fill="#1a1a2e"/>
  <rect x="14" y="10" width="3" height="7" rx="0.5" fill="#1a1a2e"/>
